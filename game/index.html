<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Island Runway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1822; }
  #scene, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Island Runway: fly the ring course around the island, then land on the runway"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
